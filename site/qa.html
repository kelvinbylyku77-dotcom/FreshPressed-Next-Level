<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh Pressed layout review</title><style>body{margin:0;background:#dce0d4;font:14px sans-serif;color:#203e2d}header{min-height:54px;display:flex;gap:20px;align-items:center;padding:0 20px;background:white}label{display:flex;align-items:center;gap:8px}select,button{padding:7px;font:inherit}main{padding:15px;display:flex;gap:25px;align-items:start;overflow:auto}iframe{border:0;height:830px;flex-shrink:0;background:#f8f6eb}#desktop{display:none;transform:scale(.88);transform-origin:top left}body.wide #desktop{display:block}body.wide #mobile,body.wide #largeMobile{display:none}</style></head><body><header><strong>Layout review</strong><label>Page<select id="route"><option value="index.html">Home</option><option value="shop.html">Shop</option></select></label><label>Width<select id="layout"><option value="390">390 px</option><option value="393">393 px</option><option value="414">414 px</option><option value="430">430 px</option><option value="1440">1440 px desktop</option></select></label><label>Section<select id="section"><option value=".hero">Hero / top</option><option value=".categories">Categories</option><option value=".favorites">Featured products</option><option value=".acai-feature">Açaí</option><option value=".energy-section">Big flavor</option><option value=".build-section">Build your own</option><option value=".juice-section">Cleanses</option><option value=".story-section">Story</option><option value=".visit-section">Location</option><option value=".community">Community</option><option value=".last-call">Final CTA</option><option value=".footer">Footer</option><option value=".catalog">Shop results</option></select></label><button id="up">Previous view</button><button id="down">Next view</button><button id="reload">Reload frames</button></header><main><iframe id="mobile" title="Mobile review" width="390" src="index.html"></iframe><iframe id="largeMobile" title="430 pixel comparison" width="430" src="index.html"></iframe><iframe id="desktop" title="Desktop review" width="1440" src="index.html"></iframe></main><script>const frames=[...document.querySelectorAll('iframe')];frames.forEach(f=>f.onload=()=>{const s=f.contentDocument.createElement('style');s.textContent='html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';f.contentDocument.head.append(s)});document.getElementById('route').onchange=e=>frames.forEach(f=>f.src=e.target.value);document.getElementById('layout').onchange=e=>{document.body.classList.toggle('wide',e.target.value==='1440');document.getElementById('mobile').width=e.target.value};document.getElementById('section').onchange=e=>frames.forEach(f=>{const el=f.contentDocument.querySelector(e.target.value);if(el)f.contentWindow.scrollTo({top:el.getBoundingClientRect().top+f.contentWindow.scrollY-85,behavior:'instant'})});document.getElementById('up').onclick=()=>frames.forEach(f=>f.contentWindow.scrollBy({top:-630,behavior:'instant'}));document.getElementById('down').onclick=()=>frames.forEach(f=>f.contentWindow.scrollBy({top:630,behavior:'instant'}));document.getElementById('reload').onclick=()=>frames.forEach(f=>f.src=document.getElementById('route').value);</script></body></html>
